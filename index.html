<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd2fb">
<meta name="mobile-web-app-capable" content="yes">
<title>Merge Rocket</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div class="app" id="app">
  <div class="scene" id="scene"><div class="stars"></div><div class="sun"></div><div class="hills"></div></div>

  <div class="hud">
    <div class="lvlBox"><div class="orb" id="lvl">1</div>
      <div class="xpwrap"><div class="xplabel">XP <span id="xpTxt">0/6</span></div><div class="xpbar"><i id="xpFill"></i></div></div>
    </div>
    <div class="chip" id="chipCoins"><span id="icCoin"></span><span id="coins">0</span></div>
    <div class="chip" id="chipEnergy"><span id="icEnergy"></span><span id="energy">0/50</span></div>
    <button class="iconBtn" id="btnGear">⚙️</button>
  </div>

  <div class="guide">
    <div class="face" id="guideFace"></div>
    <div class="bubble" id="guideTxt">Welcome!</div>
  </div>

  <div class="orderWrap">
    <button class="oArrow l" id="oLeft">‹</button>
    <div class="orders" id="orders"></div>
    <button class="oArrow r" id="oRight">›</button>
    <button class="questBtn" id="btnQuests"><span class="qIc">📜</span><span class="qTxt" id="questTxt">Quests</span><span class="dot" id="dotQuest" style="display:none"></span></button>
  </div>

  <div class="stage" id="stage">
    <div class="stageTop">
      <div class="worldTag"><span id="worldIcon"></span><span id="worldName">Sunny Meadow</span></div>
      <div class="tools" id="tools">
        <button class="hintTag" id="btnSnack">🍪 +20</button>
        <button class="hintTag" id="btnHint">💡 Hint</button>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="fx" id="fx"></div>
    <div class="tray" id="bagTray">
      <div class="trayHead"><b id="bagTitle">Storage bag</b><button class="xBtn" id="bagClose">✕</button></div>
      <div class="traySlots" id="bagSlots"></div>
      <div class="trayNote">Tap a board item, then <b>Stash</b> — tap it here to bring it back.</div>
    </div>
  </div>

  <div class="infoBar" id="infoBar">
    <div id="infoTxt"></div>
    <button class="sellBtn alt" id="btnStash">Stash</button>
    <button class="sellBtn" id="btnSell">Sell</button>
    <button class="xBtn" id="infoClose">✕</button>
  </div>

  <div class="dock six">
    <button class="tab on" data-v="board"><span class="ti">🧩</span>Board</button>
    <button class="tab" data-v="shop" id="tabShop"><span class="ti">🛒</span>Shop<span class="dot" id="dotShop" style="display:none"></span></button>
    <button class="tab" data-v="lab" id="tabLab"><span class="ti">🔬</span>Lab</button>
    <button class="tab" data-v="rocket" id="tabRocket"><span class="ti">🏛️</span>Vault<span class="dot" id="dotRocket" style="display:none"></span></button>
    <button class="tab" data-v="book"><span class="ti">📖</span>Guide</button>
    <button class="tab" data-v="map" id="tabMap"><span class="ti">🌍</span>World<span class="dot" id="dotWorld" style="display:none"></span></button>
  </div>

  <div class="screen" id="sc-shop">
    <div class="scHead"><div class="scTitle">🛒 Trading Post</div>
      <div class="scCoins"><span id="shopCoinIc"></span><span id="shopCoins">0</span></div>
      <button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="shopBody"></div>
  </div>
  <div class="screen" id="sc-lab">
    <div class="scHead"><div class="scTitle">🔬 Research Lab</div>
      <div class="scCoins"><span id="labCoinIc"></span><span id="labCoins">0</span></div>
      <button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="labBody"></div>
  </div>
  <div class="screen" id="sc-rocket">
    <div class="scHead"><div class="scTitle">🏛️ Vault &amp; Tasks</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="rocketBody"></div>
  </div>
  <div class="screen" id="sc-book">
    <div class="scHead"><div class="scTitle">📖 Merge Guide</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="bookBody"></div>
  </div>
  <div class="screen" id="sc-map">
    <div class="scHead"><div class="scTitle">🌍 World &amp; Galaxy</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="mapBody"></div>
  </div>

  <!-- the side games share one overlay; each one draws its own body -->
  <div class="mini" id="mini">
    <div class="miniBox">
      <div class="miniHead"><div class="miniTitle" id="miniTitle"></div>
        <button class="xBtn" id="miniClose">✕</button></div>
      <div class="miniSub" id="miniSub"></div>
      <div class="miniBody" id="miniBody"></div>
      <div class="miniFoot" id="miniFoot"></div>
    </div>
  </div>

  <!-- the guided intro: four dimmers leave a live hole over whatever you should
       tap next, so the thing you are told to press is the only thing you can -->
  <div class="tut" id="tut">
    <i class="tDim" id="tTop"></i><i class="tDim" id="tBot"></i>
    <i class="tDim" id="tLeft"></i><i class="tDim" id="tRight"></i>
    <div class="tRing" id="tRing"></div>
    <div class="tHand" id="tHand">👆</div>
    <div class="tBubble" id="tBubble">
      <div class="face" id="tFace"></div>
      <div class="tSay" id="tSay"></div>
      <div class="tRow"><button class="tSkip" id="tSkip">Skip intro</button><button class="tNext" id="tNext">Got it</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="levelup" id="levelup"><div class="luCard"><div class="luT" id="luTxt">LEVEL 2!</div><div class="luS" id="luSub">Energy refilled</div></div></div>

  <div class="modal" id="modal"><div class="mBoxW">
    <div class="face" id="mFace"></div>
    <div class="mTitle" id="mTitle"></div>
    <div class="mBody" id="mBody"></div>
    <button class="big" id="mBtn">OK</button>
  </div></div>

  <div class="cut" id="cut">
    <div id="warps" style="position:absolute;inset:0"></div>
    <div id="cutRocket"></div>
    <div class="cutT" id="cutTitle">Blasting off!</div>
    <div class="cutS" id="cutSub"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
