<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd2fb">
<meta name="mobile-web-app-capable" content="yes">
<title>Merge Rocket</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div class="app" id="app">
  <div class="bootScr" id="bootScr"><div class="bootLogo"></div><div class="bootBar"><i></i></div></div>
  <!-- the board sits on the same painted world the camp is drawn in, pushed
       back with a blur and a warm wash so the tiles stay readable -->
  <div class="scene" id="scene"><div class="sceneBack"></div><div class="sceneWash"></div>
    <div class="stars"></div><div class="sun"></div><div class="hills"></div></div>

  <div class="hud">
    <div class="lvlBox"><span class="avatar" id="avatar"></span><div class="orb" id="lvl">1</div>
      <div class="xpwrap"><div class="xplabel">XP <span id="xpTxt">0/6</span></div><div class="xpbar"><i id="xpFill"></i></div></div>
    </div>
    <div class="chip" id="chipEnergy"><span id="icEnergy"></span><span id="energy">0/50</span></div>
    <div class="chip" id="chipCoins"><span id="icCoin"></span><span id="coins">0</span></div>
    <div class="chip" id="chipGems"><span id="icGem"></span><span id="gems">0</span></div>
    <button class="hudShop tab" data-v="shop" id="tabShop"><span class="ti">🛒</span><span class="dot" id="dotShop" style="display:none"></span></button>
    <button class="iconBtn" id="btnGear">⚙️</button>
  </div>

  <!-- Travel Town layout: a slim column of widgets on the left, the customers
       standing in a row on the right, the board under them, and only storage,
       the item line and the galaxy at the bottom -->
  <div class="topRow">
    <div class="side" id="side">
      <button class="sideW chapW" id="btnQuests"></button>
      <button class="sideW tab" data-v="rocket" id="tabRocket"><span class="ti">📜</span><i>Goals</i><span class="dot" id="dotRocket" style="display:none"></span></button>
      <div class="quick" id="quick"></div>
    </div>
    <div class="orderWrap">
      <button class="oArrow l" id="oLeft">‹</button>
      <div class="orders" id="orders"></div>
      <div class="oMile" id="oMile" title="Contracts until the next chest"></div>
      <button class="oArrow r" id="oRight">›</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="tools" id="tools">
      <button class="hintTag" id="btnSnack">🍪 +20</button>
      <button class="hintTag" id="btnHint"><span class="hintIc">💡</span></button>
    </div>
    <div class="board" id="board"></div>
    <div class="fx" id="fx"></div>
    <div class="tray" id="bagTray">
      <div class="trayHead"><b id="bagTitle">Storage</b><button class="xBtn" id="bagClose">✕</button></div>
      <div class="traySlots" id="bagSlots"></div>
      <div class="trayNote">Tap an item, then <b>Stash</b>.</div>
    </div>
  </div>

  <div class="bottomBar" id="bottomBar">
    <button class="bbBtn" id="btnStore"><span class="ti">📦</span><span class="n" id="storeN"></span></button>
    <button class="chapLine" id="chapLine"></button>
    <div class="infoBar" id="infoBar">
      <div id="infoTxt"></div>
      <button class="sellBtn alt" id="btnStash">Stash</button>
      <button class="sellBtn sci" id="btnRecycle">🧪</button>
      <button class="sellBtn gold" id="btnShow" style="display:none">🏆</button>
      <button class="sellBtn" id="btnSell">Sell</button>
      <button class="sellBtn undoBtn" id="btnUndo">↩ Undo</button>
      <button class="xBtn" id="infoClose">✕</button>
    </div>
    <button class="bbBtn tab galBtn" data-v="map" id="tabMap"><span class="ti">🌌</span><span class="dot" id="dotWorld" style="display:none"></span></button>
  </div>
  <!-- what used to be dock tabs now live on the map; kept as hidden hooks -->
  <div class="hidden" id="rail" aria-hidden="true">
    <button class="tab" data-v="fun" id="tabFun"><span class="dot" id="dotFun"></span></button>
    <button class="tab" data-v="lab" id="tabLab"><span class="dot" id="dotLab"></span></button>
    <button class="tab" data-v="book" id="tabBook"><span class="dot" id="dotBook"></span></button>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="screen" id="sc-shop">
    <div class="scHead"><div class="scTitle">🛒 Trading Post</div>
      <span class="hidden" id="shopCoinIc"></span><span class="hidden" id="shopCoins">0</span>
      <button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="shopBody"></div>
  </div>
  <div class="screen scene lab" id="sc-lab">
    <div class="scHead"><div class="scTitle">🔬 Dr. Zonk's Lab</div>
      <div class="scCoins sciChip"><span>🧪</span><span id="labCoins">0</span></div>
      <button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="labBody"></div>
  </div>
  <div class="screen" id="sc-rocket">
    <div class="scHead"><div class="scTitle">📜 Goals</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="rocketBody"></div>
  </div>
  <div class="screen" id="sc-book">
    <div class="scHead"><div class="scTitle">📖 Collection</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="bookBody"></div>
  </div>
  <div class="screen scene" id="sc-map">
    <div class="scHead"><div class="scTitle" id="mapTitle">🌍 World</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="mapBody"></div>
  </div>

  <!-- the side games share one overlay; each one draws its own body -->
  <div class="mini" id="mini">
    <div class="miniBox">
      <div class="miniHead"><div class="miniTitle" id="miniTitle"></div>
        <button class="xBtn" id="miniClose">✕</button></div>
      <div class="miniSub" id="miniSub"></div>
      <div class="miniBody" id="miniBody"></div>
      <div class="miniFoot" id="miniFoot"></div>
    </div>
  </div>

  <!-- the guided intro: four dimmers leave a live hole over whatever you should
       tap next, so the thing you are told to press is the only thing you can -->
  <div class="tut" id="tut">
    <i class="tDim" id="tTop"></i><i class="tDim" id="tBot"></i>
    <i class="tDim" id="tLeft"></i><i class="tDim" id="tRight"></i>
    <div class="tRing" id="tRing"></div>
    <div class="tHand" id="tHand">👆</div>
    <div class="tBubble" id="tBubble">
      <div class="face" id="tFace"></div>
      <div class="tSay" id="tSay"></div>
      <div class="tRow"><button class="tSkip" id="tSkip">Skip intro</button><button class="tNext" id="tNext">Got it</button></div>
    </div>
  </div>

  <!-- a generic popup for the small things: energy, the wheel, events, fun -->
  <div class="pop" id="pop"><div class="popBox">
    <div class="popRibbon" id="popTitle"></div>
    <button class="popX" id="popX">✕</button>
    <div class="popBody" id="popBody"></div>
  </div></div>

  <!-- story scenes: a big portrait and a speech box, tap to go on -->
  <div class="talk" id="talk">
    <div class="tkFace" id="tkFace"></div>
    <div class="tkBox"><div class="tkName" id="tkName"></div><div class="tkText" id="tkText"></div><div class="tkMore">tap ▸</div></div>
  </div>

  <div class="coach" id="coach"><div class="coachRing" id="coachRing"></div>
    <div class="coachBub" id="coachBub"><span class="coachFace" id="coachFace"></span><span id="coachTxt"></span></div></div>

  <div class="toast" id="toast"></div>

  <div class="levelup" id="levelup"><div class="luRays"></div><div class="luCard"><div class="luT" id="luTxt">LEVEL 2!</div><div class="luS" id="luSub">Energy refilled</div></div></div>

  <div class="modal" id="modal"><div class="mBoxW">
    <button class="mX" id="mX" aria-label="Close">✕</button>
    <div class="face" id="mFace"></div>
    <div class="mTitle" id="mTitle"></div>
    <div class="mBody" id="mBody"></div>
    <button class="big" id="mBtn">OK</button>
  </div></div>

  <div class="cut" id="cut">
    <div id="warps" style="position:absolute;inset:0"></div>
    <div id="cutRocket"></div>
    <div class="cutT" id="cutTitle">Blasting off!</div>
    <div class="cutS" id="cutSub"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
