<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd2fb">
<meta name="mobile-web-app-capable" content="yes">
<title>Merge Rocket</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div class="app" id="app">
  <div class="scene" id="scene"><div class="stars"></div><div class="sun"></div><div class="hills"></div></div>

  <div class="hud">
    <div class="lvlBox"><div class="orb" id="lvl">1</div>
      <div class="xpwrap"><div class="xplabel">XP <span id="xpTxt">0/6</span></div><div class="xpbar"><i id="xpFill"></i></div></div>
    </div>
    <div class="chip" id="chipCoins"><span id="icCoin"></span><span id="coins">0</span></div>
    <div class="chip" id="chipEnergy"><span id="icEnergy"></span><span id="energy">0/50</span></div>
    <button class="iconBtn" id="btnGear">⚙️</button>
  </div>

  <div class="guide">
    <div class="face" id="guideFace"></div>
    <div class="bubble" id="guideTxt">Welcome!</div>
  </div>

  <div class="orders" id="orders"></div>

  <div class="stage" id="stage">
    <div class="stageTop">
      <div class="worldTag"><span id="worldIcon"></span><span id="worldName">Sunny Meadow</span></div>
      <div style="display:flex;gap:6px">
        <button class="hintTag" id="btnSnack">🍪 +20</button>
        <button class="hintTag" id="btnHint">💡 Hint</button>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="fx" id="fx"></div>
  </div>

  <div class="infoBar" id="infoBar">
    <div id="infoTxt"></div>
    <button class="sellBtn" id="btnSell">Sell</button>
    <button class="xBtn" id="infoClose">✕</button>
  </div>

  <div class="dock">
    <button class="tab on" data-v="board"><span class="ti">🧩</span>Board</button>
    <button class="tab" data-v="rocket" id="tabRocket"><span class="ti">🚀</span>Rocket<span class="dot" id="dotRocket" style="display:none"></span></button>
    <button class="tab" data-v="book"><span class="ti">📖</span>Guide</button>
    <button class="tab" data-v="map" id="tabMap"><span class="ti">🗺️</span>Map</button>
  </div>

  <div class="screen" id="sc-rocket">
    <div class="scHead"><div class="scTitle">🚀 Rocket &amp; Missions</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="rocketBody"></div>
  </div>
  <div class="screen" id="sc-book">
    <div class="scHead"><div class="scTitle">📖 Merge Guide</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="bookBody"></div>
  </div>
  <div class="screen" id="sc-map">
    <div class="scHead"><div class="scTitle">🗺️ Galaxy Map</div><button class="iconBtn scClose">✕</button></div>
    <div class="scBody" id="mapBody"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="levelup" id="levelup"><div class="luCard"><div class="luT" id="luTxt">LEVEL 2!</div><div class="luS" id="luSub">Energy refilled</div></div></div>

  <div class="modal" id="modal"><div class="mBoxW">
    <div class="face" id="mFace"></div>
    <div class="mTitle" id="mTitle"></div>
    <div class="mBody" id="mBody"></div>
    <button class="big" id="mBtn">OK</button>
  </div></div>

  <div class="cut" id="cut">
    <div id="warps" style="position:absolute;inset:0"></div>
    <div id="cutRocket"></div>
    <div class="cutT" id="cutTitle">Blasting off!</div>
    <div class="cutS" id="cutSub"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
